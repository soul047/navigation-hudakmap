<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>후닥맵</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    /* ── 기본 레이아웃 ── */
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, 'Noto Sans KR', Arial, sans-serif; }
    #app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

    /* ── 탑바 ── */
    .topbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      background: #0a2540;
      color: #fff;
    }
    .brand { font-weight: 800; letter-spacing: .5px; white-space: nowrap; }

    /* ── 검색 ── */
    .searchbox { position: relative; max-width: 480px; width: 100%; }
    .searchbox input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #cbd5e1; outline: none; box-sizing: border-box;
    }
    .search-results {
      position: absolute; top: 42px; left: 0; right: 0;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
      max-height: 200px; overflow: auto;
      box-shadow: 0 12px 24px rgba(0,0,0,.12); z-index: 1000; color: #000;
    }
    .search-item { padding: 10px 12px; cursor: pointer; color: #000; }
    .search-item:hover { background: #f1f5f9; }

    /* ── 우측 컨트롤 ── */
    .right-controls { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
    .btn {
      padding: 8px 10px; border: 1px solid #94a3b8; border-radius: 10px;
      background: #0a2540; color: #fff; cursor: pointer; white-space: nowrap; font-size: 13px;
    }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.active { background: #2563eb; border-color: #2563eb; }
    input[type="color"] { width: 36px; height: 36px; padding: 0; border: none; background: transparent; cursor: pointer; }

    /* ── 지도 ── */
    #map { width: 100%; height: 100%; }

    /* ── 좌표 HUD ── */
    .coords {
      position: absolute; left: 12px; bottom: 12px;
      background: #0a2540; color: #fff; padding: 8px 10px;
      border-radius: 10px; opacity: .92; font-size: 12px; z-index: 500;
    }

    /* ── 토스트 ── */
    #toast {
      display: none; position: fixed; left: 50%; transform: translateX(-50%);
      top: 10px; padding: 8px 14px; border-radius: 10px; z-index: 2000;
      box-shadow: 0 6px 16px rgba(0,0,0,.2); font-size: 13px;
      background: #1e293b; color: #fff;
    }
    #toast.err { background: #ef4444; }

    /* ── 복사 모달 ── */
    .copy-modal {
      display: none; position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
      background: #111827; color: #fff; padding: 12px; border-radius: 10px;
      z-index: 2100; box-shadow: 0 8px 24px rgba(0,0,0,.3); width: min(560px, 92vw);
    }
    .copy-modal input {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 1px solid #374151; background: #1f2937; color: #fff; box-sizing: border-box;
    }
    .copy-modal .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; justify-content: flex-end; }

    /* ── 히스토리 패널 ── */
    #historyPanel {
      display: none; position: absolute; right: 10px; top: 58px;
      width: 280px; max-height: 260px; overflow: auto;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
      box-shadow: 0 12px 24px rgba(0,0,0,.12); z-index: 1001;
    }

    /* ── 업로드 버튼 ── */
    #mediaUploadBtn {
      position: relative; overflow: hidden;
    }
    #mediaUploadBtn input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0;
    }

    /* ── 업로드 진행 토스트 ── */
    #uploadStatus {
      display: none; position: fixed; right: 16px; bottom: 60px;
      background: #0a2540; color: #fff; padding: 10px 14px;
      border-radius: 10px; font-size: 13px; z-index: 1500;
      box-shadow: 0 6px 16px rgba(0,0,0,.2); min-width: 180px;
    }

    /* ── 클러스터 마커 ── */
    .hudak-cluster-marker {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 52px; height: 52px; border-radius: 50%;
      background: #0a2540; border: 2.5px solid #fff;
      box-shadow: 0 3px 12px rgba(0,0,0,.35); cursor: pointer;
      transition: transform .15s;
    }
    .hudak-cluster-marker:hover { transform: scale(1.1); }
    .hudak-cluster-icon { font-size: 18px; line-height: 1; }
    .hudak-cluster-count {
      font-size: 11px; font-weight: 700; color: #fff; line-height: 1;
    }

    /* ── 미디어 패널 ── */
    .hudak-media-panel {
      position: fixed; bottom: -100%; left: 0; right: 0;
      height: 52vh; max-height: 400px;
      background: #fff; border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,.18);
      z-index: 1200; transition: bottom .3s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column;
    }
    .hudak-media-panel.open { bottom: 0; }
    .hudak-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px; border-bottom: 1px solid #f1f5f9;
    }
    .hudak-panel-title { font-weight: 700; font-size: 15px; }
    .hudak-panel-close {
      background: none; border: none; font-size: 18px; cursor: pointer; color: #64748b; padding: 4px;
    }
    .hudak-panel-body {
      flex: 1; overflow-x: auto; overflow-y: hidden;
      display: flex; gap: 10px; padding: 12px 16px; align-items: flex-start;
    }
    .hudak-media-thumb {
      position: relative; flex-shrink: 0; width: 120px; cursor: pointer;
      border-radius: 10px; overflow: hidden; background: #f1f5f9;
    }
    .thumb-img { width: 120px; height: 120px; object-fit: cover; display: block; }
    .thumb-badge {
      position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,.5); color: #fff;
      border-radius: 50%; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center; font-size: 11px;
    }
    .thumb-date {
      padding: 4px 6px; font-size: 11px; color: #64748b; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    @media (max-width: 640px) {
      .searchbox { max-width: 100%; }
      .right-controls { gap: 4px; }
      .btn { padding: 7px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">후닥맵</div>

    <div class="searchbox">
      <input id="q" placeholder="장소·주소 검색 (예: 서울시청, 해운대)" autocomplete="off" />
      <div id="results" class="search-results" style="display:none;"></div>
    </div>

    <div class="right-controls">
      <!-- 추억 업로드 버튼 -->
      <button id="mediaUploadBtn" class="btn" title="이 장소의 사진·영상 업로드">
        📸 추억 올리기
        <input type="file" id="mediaInput" multiple accept="image/*,video/*" />
      </button>

      <button id="btnCopyAddr" class="btn ghost">주소 복사</button>
      <button id="btnFav" class="btn ghost">즐겨찾기</button>
      <button id="btnHistory" class="btn ghost">검색 기록</button>
      <button id="btnShareLink" class="btn">장소 공유</button>
      <button id="btnClear" class="btn ghost">마커 지우기</button>
      <input id="pinColor" type="color" value="#22c55e" title="마커 색상" />
    </div>

    <!-- 검색 기록 패널 -->
    <div id="historyPanel"></div>

    <!-- 토스트 -->
    <div id="toast"></div>

    <!-- 복사 모달 -->
    <div id="copyModal" class="copy-modal">
      <div>복사 권한이 차단되어 있어요. 아래 내용을 <b>Ctrl/⌘ + C</b>로 복사하세요.</div>
      <input id="copyInput" readonly />
      <div class="row"><button id="btnCopyClose" class="btn">닫기</button></div>
    </div>
  </div>

  <div id="map"></div>
</div>

<div class="coords" id="coords">--</div>

<!-- 업로드 상태 -->
<div id="uploadStatus"></div>

<!-- CDN 순서 중요: Leaflet → exif-js → ES 모듈 -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.js"></script>

<script type="module">
import {
  map, markers, permalink,
  goTo, reverseGeocode, runSearch,
  addHistory, getHistory,
  updatePinColor, escapeHtml,
  handleMediaUpload
} from './core/map.js'

// ─── 유틸 ─────────────────────────────────────────────────
const $ = id => document.getElementById(id)

let _toastTimer = null
function showToast(msg, isErr = false) {
  const el = $('toast')
  el.textContent = msg
  el.className = isErr ? 'err' : ''
  el.style.display = 'block'
  clearTimeout(_toastTimer)
  _toastTimer = setTimeout(() => { el.style.display = 'none' }, 2400)
}

async function safeCopy(text, label = '복사했어요.') {
  try {
    await navigator.clipboard.writeText(text)
    showToast(label)
  } catch {
    try {
      const ta = Object.assign(document.createElement('textarea'), {
        value: text, style: 'position:fixed;top:-9999px'
      })
      document.body.appendChild(ta); ta.select()
      document.execCommand('copy')
      document.body.removeChild(ta)
      showToast(label)
    } catch {
      $('copyInput').value = text
      $('copyModal').style.display = 'block'
      $('copyInput').select()
    }
  }
}

// ─── 검색 바인딩 ──────────────────────────────────────────
const $q = $('q')
const $results = $('results')
let _searchTimer = null

$q.addEventListener('input', () => {
  const v = $q.value.trim()
  if (!v) { $results.style.display = 'none'; return }
  clearTimeout(_searchTimer)
  _searchTimer = setTimeout(async () => {
    try {
      const list = await runSearch(v)
      if (!list.length) { $results.style.display = 'none'; return }
      $results.innerHTML = list.map(it =>
        `<div class="search-item" data-lat="${it.lat}" data-lon="${it.lon}">${escapeHtml(it.label)}</div>`
      ).join('')
      $results.style.display = 'block'
    } catch (e) {
      showToast('검색 중 오류가 발생했어요.', true)
      console.warn(e)
    }
  }, 250)
})

$results.addEventListener('click', e => {
  const el = e.target.closest('.search-item')
  if (!el) return
  const lat = parseFloat(el.dataset.lat)
  const lon = parseFloat(el.dataset.lon)
  addHistory(el.textContent.trim(), lat, lon)
  $results.style.display = 'none'
  goTo([lat, lon], 17, true)
})

document.addEventListener('click', e => {
  if (!$q.contains(e.target) && !$results.contains(e.target)) {
    $results.style.display = 'none'
  }
})

// ─── 검색 기록 패널 ───────────────────────────────────────
function renderHistory() {
  const items = getHistory()
  const panel = $('historyPanel')
  panel.innerHTML = items.length
    ? items.map(it =>
        `<div class="search-item" data-lat="${it.lat}" data-lon="${it.lon}">${escapeHtml(it.label)}</div>`
      ).join('')
    : '<div style="padding:10px;color:#64748b">기록 없음</div>'
}

$('historyPanel').addEventListener('click', e => {
  const el = e.target.closest('.search-item')
  if (!el) return
  goTo([parseFloat(el.dataset.lat), parseFloat(el.dataset.lon)], 17, true)
  $('historyPanel').style.display = 'none'
})

$('btnHistory').addEventListener('click', () => {
  const p = $('historyPanel')
  if (p.style.display === 'none' || !p.style.display) {
    renderHistory(); p.style.display = 'block'
  } else {
    p.style.display = 'none'
  }
})

// ─── 액션 버튼 ────────────────────────────────────────────
$('btnCopyAddr').addEventListener('click', async () => {
  const c = map.getCenter()
  const addr = await reverseGeocode(c.lat, c.lng)
  safeCopy(addr || `${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`, '주소를 복사했어요.')
})

$('btnShareLink').addEventListener('click', async () => {
  const url = permalink()
  if (navigator.share) {
    try { await navigator.share({ title: '후닥맵', url }); return } catch {}
  }
  safeCopy(url, '링크를 복사했어요.')
})

$('btnClear').addEventListener('click', () => markers.clearLayers())

$('btnFav').addEventListener('click', () => {
  const name = prompt('즐겨찾기 이름을 입력하세요', '현재 위치')
  if (!name) return
  const c = map.getCenter()
  const label = `${name} · ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`
  addHistory(label, c.lat, c.lng)
  showToast('즐겨찾기에 저장했어요.')
})

$('pinColor').value = localStorage.getItem('hudak_pin_color') || '#22c55e'
$('pinColor').addEventListener('input', e => updatePinColor(e.target.value))

$('copyModal').querySelector('#btnCopyClose').addEventListener('click', () => {
  $('copyModal').style.display = 'none'
})
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('copyModal').style.display = 'none'
})

// ─── 미디어 업로드 ────────────────────────────────────────
$('mediaInput').addEventListener('change', async e => {
  const files = [...e.target.files]
  if (!files.length) return

  const statusEl = $('uploadStatus')
  statusEl.style.display = 'block'
  statusEl.textContent = `처리 중… 0 / ${files.length}`

  const result = await handleMediaUpload(files, ({ processed, skipped, total }) => {
    statusEl.textContent = `처리 중… ${processed + skipped} / ${total}`
  })

  statusEl.style.display = 'none'
  e.target.value = '' // 같은 파일 재업로드 가능하게

  const msg = result.processed > 0
    ? `📸 ${result.processed}장 추가됨${result.skipped > 0 ? ` (GPS 없음 ${result.skipped}장 건너뜀)` : ''}`
    : `GPS 정보가 없어 추가할 수 없었어요. (${result.skipped}장)`

  showToast(msg, result.processed === 0)
})

// ─── URL 해시로 초기 위치 복원 ────────────────────────────
;(function restoreHash() {
  const m = location.hash.match(/#(\d+)\/([-\d.]+)\/([-\d.]+)/)
  if (m) {
    const [, z, lat, lon] = m
    map.setView([+lat, +lon], +z)
  }
})()
</script>
</body>
</html>
